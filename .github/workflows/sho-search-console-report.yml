name: Sho Search Console Report

on:
  workflow_dispatch:
  schedule:
    - cron: "45 23 * * 1" # Monday 08:45 JST

permissions:
  contents: read
  issues: write

jobs:
  gsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm init -y >/dev/null 2>&1 || true
      - run: npm install googleapis >/dev/null
      - run: node scripts/integrations/sho-search-console-report.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://sho-blog.com/' }}
