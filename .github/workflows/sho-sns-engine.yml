name: Sho SNS Engine

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "instagram / threads / x / all"
        required: true
        default: "all"
        type: choice
        options: [instagram, threads, x, all]
  schedule:
    - cron: "10 23 * * *" # 08:10 JST

permissions:
  contents: read
  issues: write

jobs:
  sns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/growth/sho-growth-engine.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          MODE: daily
          DRY_RUN: "false"
          SITE_URL: "https://sho-blog.com/"
