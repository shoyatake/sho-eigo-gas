name: Sho CEO Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * *" # 07:45 JST

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  ceo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/ops/sho-ceo-agent.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
