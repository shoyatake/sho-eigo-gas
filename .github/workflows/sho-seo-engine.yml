name: Sho SEO Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1" # 毎週月曜 08:30 JST

permissions:
  contents: read
  issues: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/growth/sho-growth-engine.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          MODE: seo
          DRY_RUN: "false"
          SITE_URL: "https://sho-blog.com/"
