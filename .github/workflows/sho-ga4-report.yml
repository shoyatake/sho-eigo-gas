name: Sho GA4 Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 JST

permissions:
  contents: read
  issues: write

jobs:
  ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm init -y >/dev/null 2>&1 || true
      - run: npm install @google-analytics/data >/dev/null
      - run: node scripts/integrations/sho-ga4-report.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
